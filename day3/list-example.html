<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>List type examples</h1>
    <h2>Ordered List</h2>
    <ol type="i" start="10">
        <li>Apple</li>
          <li>Banana</li>
            <li>Carrot</li>
              <li>Dragon Fruit</li>
                <li>Egg</li>
    </ol>
    <h2>Unordered List</h2>
    <ul type="square">
     <li>Apple</li>
          <li>Banana</li>
            <li>Carrot</li>
              <li>Dragon Fruit</li>
                <li>Egg</li>
    </ul>
    <h2>Defination List</h2>
    <dl>
        <dt>Apple</dt>
        <dd>Apple is a fruit.
                     And I like apple.</dd>
    </dl>
    <h2>Table</h2>
    <table border="1">
        <tr>
            <th>SN</th>
            <th>Name</th>
            <th>Roll</th>
        </tr>
        <tr>
            <td>1.</td>
            <td>Aakash</td>
            <td>1</td>
        </tr>
         <tr>
            <td>2.</td>
            <td>Bikash</td>
            <td>2</td>
        </tr>
    </table>
</body>
</html>
